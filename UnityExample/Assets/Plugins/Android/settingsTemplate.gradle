pluginManagement {
    repositories {
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher', ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // Internal tooling (pm-tools native-dev): inert unless OCTOPUS_ANDROID_DEV_REPO is set.
        // Kept outside the Android Resolver markers below, which EDM4U regenerates.
        def octopusDevRepo = System.getenv("OCTOPUS_ANDROID_DEV_REPO")
        if (octopusDevRepo && findByName("octopusNativeDev") == null) {
            exclusiveContent {
                forRepository { maven { name = "octopusNativeDev"; url = uri(octopusDevRepo) } }
                filter { includeGroup("com.octopuscommunity") }
            }
        }
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        def unityProjectPath = $/file:///**DIR_UNITYPROJECT**/$.replace("\\", "/")
        maven {
            url (unityProjectPath + "/Assets/GeneratedLocalRepo/Firebase/m2repository") // Assets/Firebase/Editor/AppDependencies.xml:25, Assets/Firebase/Editor/MessagingDependencies.xml:27
        }
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
